name: Sabah brifingi

on:
  schedule:
    - cron: '20 4 * * 1-5'   # Hafta içi 07:20 Türkiye saati (04:20 UTC)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests google-genai
      - name: Brifingi hazırla
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/brief.py
      - name: Sonucu kaydet
        run: |
          git config user.name "sabah-brifingi"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Brifing $(date +%F)"
          git push
